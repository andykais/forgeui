<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
  stroke="#6fb6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    The anvil the app is named for, in the accent the wordmark used to be
    (#6fb6c8, `--accent`). An SVG rather than a .ico: every browser this
    desktop app runs in takes one, and it stays sharp at any size.

    No `width`/`height`, so it scales to whatever the tab or the bookmark
    bar asks for, and no background, so it sits on a light or a dark tab
    strip equally well.
  -->
  <path d="M7 10H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1h4" />
  <path d="M7 5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1 7 7 0 0 1-7 7H8a1 1 0 0 1-1-1z" />
  <path d="M9 12v5" />
  <path d="M15 12v5" />
  <path d="M5 20a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3 1 1 0 0 1-1 1H6a1 1 0 0 1-1-1" />
</svg>
